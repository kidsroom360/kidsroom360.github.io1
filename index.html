
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kidsroom 360 - Child 2</title>

    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>

    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #f8f5f0;
            font-family: Arial, sans-serif;
        }

        #panorama {
            width: 100%;
            height: 100%;
        }

        .title {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(255,255,255,0.88);
            color: #66594c;
            padding: 12px 25px;
            border-radius: 30px;
            font-size: 18px;
            letter-spacing: 1px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.1);
        }
    </style>
</head>

<body>

    <div class="title">Kidsroom 360</div>

    <div id="panorama"></div>

    <script>
        pannellum.viewer('panorama', {
            type: 'equirectangular',
            panorama: '360.0000.png',
            autoLoad: true,
            autoRotate: -2,
            compass: false,
            showZoomCtrl: true,
            showFullscreenCtrl: true,
            mouseZoom: true,
            hfov: 100,
            minHfov: 50,
            maxHfov: 120
        });
    </script>

</body>
</html>
